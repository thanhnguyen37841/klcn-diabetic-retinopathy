name: Build Flutter APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: dr_fundus_mobile
        run: flutter pub get

      - name: Build APK (Release/Fat APK)
        working-directory: dr_fundus_mobile
        run: flutter build apk --split-per-abi=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dr_fundus_mobile-apk
          path: dr_fundus_mobile/build/app/outputs/flutter-apk/app-release.apk
